<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>2s Wykres</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #0e0e10; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #4fc3f7; margin-bottom: 20px; }
  .container { max-width: 1400px; margin: 0 auto; background: #131722; padding: 16px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  .chart-wrapper { position: relative; height: 460px; background: #131722; border-radius: 8px; }
  .scroll-bar {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; padding: 10px 14px;
    background: #1e222d; border-radius: 8px; border: 1px solid #2a2e39;
  }
  .scroll-bar button {
    padding: 6px 14px; font-size: 14px;
    background: #2a2e39; color: #fff;
    border: 1px solid #363a45; border-radius: 6px; cursor: pointer;
  }
  .scroll-bar button:hover { background: #363a45; }
  .scroll-bar input[type=range] {
    flex: 1; -webkit-appearance: none; height: 6px;
    background: #2a2e39; border-radius: 3px; outline: none;
  }
  .scroll-bar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px;
    background: #4fc3f7; border-radius: 50%; cursor: pointer;
  }
  .scroll-bar input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; background: #4fc3f7;
    border-radius: 50%; cursor: pointer; border: none;
  }
  .scroll-label { font-size: 13px; color: #94a3b8; min-width: 130px; text-align: center; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-top: 16px; padding: 14px; background: #1e222d; border-radius: 8px; }
  select, input, button { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: none; outline: none; }
  select, input { background: #2a2e39; color: #fff; border: 1px solid #363a45; }
  input[type=text] { width: 130px; }
  input[type=number] { width: 110px; }
  button { cursor: pointer; font-weight: bold; transition: 0.2s; }
  .btn-apply { background: #4fc3f7; color: #0f172a; } .btn-apply:hover { background: #38bdf8; }
  .btn-save { background: #22c55e; color: #fff; } .btn-save:hover { background: #16a34a; }
  .btn-reset { background: #64748b; color: #fff; } .btn-reset:hover { background: #475569; }
  .row-label { font-size: 14px; color: #94a3b8; margin-right: 4px; }
  .field-group { display: flex; align-items: center; gap: 6px; background: #2a2e39; padding: 6px 12px; border-radius: 6px; border: 1px solid #363a45; }
</style>
</head>
<body>
<div class="container">
  <h1>📈 2s Wykres </h1>

  <div class="chart-wrapper">
    <canvas id="mmrChart"></canvas>
  </div>

  <div class="scroll-bar">
    <button onclick="shiftView(-1)">◀</button>
    <input type="range" id="viewSlider" min="0" max="0" value="0" step="1">
    <button onclick="shiftView(1)">▶</button>
    <span class="scroll-label" id="viewLabel">—</span>
  </div>

  <div class="controls">
    <label class="field-group"><span class="row-label">Data:</span><select id="dateSelect"></select></label>

    <label class="field-group">
      <span class="row-label">Zmień o:</span>
      <input type="text" id="deltaInput" value="-9">
    </label>
    <button class="btn-apply" onclick="applyDelta()">✅ Zastosuj</button>

    <label class="field-group">
      <span class="row-label">MMR:</span>
      <input type="number" id="mmrInput">
    </label>
    <button class="btn-save" onclick="saveValue()">💾 Zapisz</button>

    <button class="btn-reset" onclick="resetAll()">🔄 Reset</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
const Y_MIN = 1250;
const Y_MAX = 1600;

// ═══════════════════════════════════════════════════════════════
// DATY: 30.09 → 31.12
// ═══════════════════════════════════════════════════════════════
function generateDates() {
  const year = new Date().getFullYear();
  const dates = [];
  let d = new Date(year, 8, 30);
  const end = new Date(year, 11, 31);
  while (d <= end) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    dates.push(`${yyyy}-${mm}-${dd}`);
    d.setDate(d.getDate()+1);
  }
  return dates;
}

const dates = generateDates();
const labels = dates.map(d => { const [_,m,dd] = d.split('-'); return `${dd}.${m}`; });

const now = new Date();
const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

let candleData = JSON.parse(localStorage.getItem('mmrCandles') || '{}');

const WINDOW_SIZE = 14;
let viewStart = 0;

// ═══════════════════════════════════════════════════════════════
function getPrevClose(dateStr) {
  const idx = dates.indexOf(dateStr);
  if (idx <= 0) return null;
  for (let i = idx - 1; i >= 0; i--) {
    const c = candleData[dates[i]];
    if (c && c.status !== 'no-play' && c.status !== 'played-zero' && c.close != null) {
      return c.close;
    }
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════
// WTYCZKA – ŚWIECE
// ═══════════════════════════════════════════════════════════════
const candlePlugin = {
  id: 'candlePlugin',
  afterDatasetsDraw(chart) {
    const { ctx, scales } = chart;
    const xScale = scales.x;
    const yScale = scales.y;
    if (!xScale || !yScale) return;

    const slotWidth = xScale.width / WINDOW_SIZE;
    const bodyWidth = Math.max(6, slotWidth * 0.6);
    const wickWidth = Math.max(1, bodyWidth * 0.15);
    const thinLineLen = bodyWidth * 0.6;

    ctx.save();
    for (let k = 0; k < WINDOW_SIZE; k++) {
      const i = viewStart + k;
      if (i >= dates.length) break;
      const c = candleData[dates[i]];
      if (!c) continue;

      const x = xScale.getPixelForValue(k);

      if (c.status === 'played-zero') {
        ctx.strokeStyle = '#84cc16';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - thinLineLen/2, yScale.getPixelForValue(c.open));
        ctx.lineTo(x + thinLineLen/2, yScale.getPixelForValue(c.open));
        ctx.stroke();
        continue;
      }

      if (c.status === 'no-play') {
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - thinLineLen/2, yScale.getPixelForValue(c.open));
        ctx.lineTo(x + thinLineLen/2, yScale.getPixelForValue(c.open));
        ctx.stroke();
        continue;
      }

      if (c.open == null || c.high == null || c.low == null || c.close == null) continue;

      const yHigh = yScale.getPixelForValue(c.high);
      const yLow  = yScale.getPixelForValue(c.low);
      const yOpen = yScale.getPixelForValue(c.open);
      const yClose= yScale.getPixelForValue(c.close);

      const color = c.close >= c.open ? '#84cc16' : '#ef4444';

      ctx.strokeStyle = color;
      ctx.lineWidth = wickWidth;
      ctx.beginPath();
      ctx.moveTo(x, yHigh);
      ctx.lineTo(x, yLow);
      ctx.stroke();

      const top = Math.min(yOpen, yClose);
      const bottom = Math.max(yOpen, yClose);
      const h = Math.max(2, bottom - top);
      ctx.fillStyle = color;
      ctx.fillRect(x - bodyWidth/2, top, bodyWidth, h);
    }
    ctx.restore();
  }
};
Chart.register(candlePlugin);

// ═══════════════════════════════════════════════════════════════
// WTYCZKA trendPlugin — USUNIĘTA (to ona rysowała fioletową linię)
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
function getVisibleLabels() {
  return labels.slice(viewStart, viewStart + WINDOW_SIZE);
}

const ctx = document.getElementById('mmrChart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'bar',
  data: {
    labels: getVisibleLabels(),
    datasets: [{
      label: 'placeholder',
      data: getVisibleLabels().map(() => null),
      backgroundColor: 'transparent',
      borderColor: 'transparent',
      barPercentage: 1,
      categoryPercentage: 1
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      y: {
        position: 'left',
        min: Y_MIN, max: Y_MAX,
        ticks: { stepSize: 50, color: '#cbd5e1' },
        grid: { color: '#000000', lineWidth: 1, drawTicks: true },
        border: { color: '#2a2e39' }
      },
      x: {
        type: 'category',
        ticks: { color: '#cbd5e1', autoSkip: false, maxRotation: 0, minRotation: 0, font: { size: 13 } },
        grid: { color: 'rgba(42,46,57,0.5)', drawTicks: true },
        border: { color: '#2a2e39' }
      }
    }
  }
});

// ═══════════════════════════════════════════════════════════════
const slider = document.getElementById('viewSlider');
const viewLabelEl = document.getElementById('viewLabel');

function updateChartView() {
  const vis = getVisibleLabels();
  chart.data.labels = vis;
  chart.data.datasets[0].data = vis.map(() => null);
  chart.update('none');

  const from = labels[viewStart];
  const to = labels[Math.min(viewStart + WINDOW_SIZE - 1, labels.length - 1)];
  viewLabelEl.textContent = `${from} → ${to}`;
}

function setViewStart(newStart) {
  const maxStart = Math.max(0, dates.length - WINDOW_SIZE);
  viewStart = Math.max(0, Math.min(maxStart, newStart));
  slider.value = viewStart;
  updateChartView();
}

function shiftView(dir) { setViewStart(viewStart + dir); }

slider.min = 0;
slider.max = Math.max(0, dates.length - WINDOW_SIZE);
slider.step = 1;
slider.value = 0;
slider.addEventListener('input', (e) => setViewStart(parseInt(e.target.value)));

(function initView() {
  let todayIdx = dates.indexOf(todayStr);
  if (todayIdx < 0) todayIdx = 0;
  const start = Math.max(0, todayIdx - Math.floor(WINDOW_SIZE / 2));
  setViewStart(start);
})();

// --- Select daty ---
const dateSelect = document.getElementById('dateSelect');
dates.forEach((d, i) => {
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = labels[i];
  dateSelect.appendChild(opt);
});
dateSelect.value = dates.includes(todayStr) ? todayStr : dates[0];

function getSelectedDate() { return dateSelect.value; }
function refreshChart() { chart.update('none'); }

// ═══════════════════════════════════════════════════════════════
// POMOCNICZA: aktualizuj pole MMR wartością close wybranego dnia
// ═══════════════════════════════════════════════════════════════
function syncMmrInput() {
  const dateStr = getSelectedDate();
  const c = candleData[dateStr];
  const mmrInput = document.getElementById('mmrInput');

  if (c && c.close != null) {
    mmrInput.value = c.close;
  } else {
    const prev = getPrevClose(dateStr);
    mmrInput.value = prev != null ? prev : '';
  }
}

// ═══════════════════════════════════════════════════════════════
function applyDelta() {
  const dateStr = getSelectedDate();
  const raw = document.getElementById('deltaInput').value.trim();

  const isPlusZero  = (raw === '+0' || raw === '+0.0');
  const isMinusZero = (raw === '-0' || raw === '-0.0');

  // "+0"
  if (isPlusZero) {
    const prevClose = getPrevClose(dateStr);
    const base = prevClose != null ? prevClose : 1450;
    candleData[dateStr] = { open: base, close: base, high: base, low: base, status: 'played-zero' };
    localStorage.setItem('mmrCandles', JSON.stringify(candleData));
    refreshChart();
    syncMmrInput();
    return;
  }

  // "-0"
  if (isMinusZero) {
    const prevClose = getPrevClose(dateStr);
    const base = prevClose != null ? prevClose : 1450;
    candleData[dateStr] = { open: base, close: null, high: null, low: null, status: 'no-play' };
    localStorage.setItem('mmrCandles', JSON.stringify(candleData));
    refreshChart();
    syncMmrInput();
    return;
  }

  // zwykła zmiana
  const amount = parseInt(raw);
  if (isNaN(amount) || amount === 0) { alert('Wpisz np. -9, +23, +0 lub -0'); return; }

  const prevClose = getPrevClose(dateStr);
  const existing = candleData[dateStr];

  let base;
  if (existing && existing.status === 'normal' && existing.close != null) base = existing.close;
  else if (prevClose != null) base = prevClose;
  else base = 1450;

  let openVal;
  if (existing && existing.status === 'normal' && existing.open != null) openVal = existing.open;
  else openVal = (prevClose != null) ? prevClose : base;

  const newClose = Math.max(0, Math.min(3000, base + amount));
  const newHigh = Math.max(existing?.high ?? openVal, newClose, openVal);
  const newLow  = Math.min(existing?.low  ?? openVal, newClose, openVal);

  candleData[dateStr] = {
    open: openVal, close: newClose, high: newHigh, low: newLow, status: 'normal'
  };

  localStorage.setItem('mmrCandles', JSON.stringify(candleData));
  refreshChart();
  syncMmrInput();

  const idx = dates.indexOf(dateStr);
  if (idx >= 0 && (idx < viewStart || idx >= viewStart + WINDOW_SIZE)) {
    setViewStart(Math.max(0, idx - Math.floor(WINDOW_SIZE / 2)));
  }
}

// nadpisz MMR
function saveValue() {
  const dateStr = getSelectedDate();
  const val = parseInt(document.getElementById('mmrInput').value);
  if (isNaN(val)) { alert('Wpisz liczbę MMR'); return; }

  const prevClose = getPrevClose(dateStr);
  const openVal = prevClose != null ? prevClose : val;

  candleData[dateStr] = {
    open: openVal, close: val,
    high: Math.max(openVal, val), low: Math.min(openVal, val),
    status: 'normal'
  };

  localStorage.setItem('mmrCandles', JSON.stringify(candleData));
  refreshChart();
}

// zmiana daty → sync pola MMR
dateSelect.addEventListener('change', syncMmrInput);

function resetAll() {
  if (!confirm('Na pewno usunąć wszystkie dane?')) return;
  candleData = {};
  localStorage.removeItem('mmrCandles');
  refreshChart();
  document.getElementById('mmrInput').value = '';
}

// start – pokaż MMR dla dzisiejszej daty
(function init() {
  syncMmrInput();
})();
</script>
</body>
</html>
